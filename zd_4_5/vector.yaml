sources:
  docker_logs:
    type: docker_logs
    docker_host: "unix:///var/run/docker.sock"

transforms:
  add_service:
    type: remap
    inputs:
      - docker_logs
    source: |
      .service = .container_name
      del(.label)

sinks:
  elasticsearch:
    type: elasticsearch
    inputs:
      - add_service
    endpoints:
      - "http://elasticsearch:9200"
    bulk:
      index: "docker-logs-%Y-%m-%d"
    auth:
      strategy: basic
      user: elastic
      password: qwerty123456