server {
    listen 8080;
    server_name localhost;

    access_log /var/log/nginx/api.access.log main;
    error_log  /var/log/nginx/api.error.log;

    client_max_body_size 20m;

    # Docker DNS: нужен, если в proxy_pass есть переменные
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /_validate_token {
        internal;
        proxy_pass http://security:3000/v1/token/validation;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }


    location = /token {
        proxy_pass http://security:3000/v1/token;
    }

    location = /v1/token {
        proxy_pass http://security:3000/v1/token;
    }

    location = /v1/register {
        proxy_pass http://security:3000/v1/user;
    }


    location = /v1/user {
        auth_request /_validate_token;
        proxy_pass http://security:3000/v1/user;
    }

    location = /v1/upload {
        auth_request /_validate_token;
        proxy_pass http://uploader:3000/v1/upload;
    }

    location = /upload {
        auth_request /_validate_token;
        proxy_pass http://uploader:3000/v1/upload;
    }


    # rewrite убирает префикс, proxy_pass без URI передаёт путь в Silo как есть.
    location ~ ^/v1/user/(?<image>.+)$ {
        auth_request /_validate_token;
        rewrite ^/v1/user/(.*)$ /images/$1 break;
        proxy_pass http://storage:9000;
    }

    location ~ ^/images/(?<image>.+)$ {
        rewrite ^/images/(.*)$ /images/$1 break;
        proxy_pass http://storage:9000;
    }
}