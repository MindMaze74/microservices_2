version: "3.8"

volumes:
  data:
  prometheus-data:
  grafana_data:
  es_data:

networks:
  minio-net:
    driver: bridge

services:
  # --- API Gateway и сервисы ---
  storage:
    image: pgsty/silo:latest
    container_name: storage
    user: "0:0"
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${Storage_Secret:-STORAGE_SECRET_KEY}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data
    networks:
      - minio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: pgsty/mc:latest
    container_name: bucket
    depends_on:
      - storage
    restart: on-failure
    networks:
      - minio-net
    entrypoint: >
      /bin/sh -c "
      mc alias set storage http://storage:9000 ${Storage_AccessKey:-STORAGE_ACCESS_KEY} ${Storage_Secret:-STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing storage/${Storage_Bucket:-images} &&
      mc anonymous set download storage/${Storage_Bucket:-images} &&
      exit 0;
      "

  uploader:
    build: ./uploader
    container_name: uploader
    depends_on:
      - storage
      - createbuckets
    expose:
      - "3000"
    networks:
      - minio-net
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      S3_ACCESS_SECRET: ${Storage_Secret:-STORAGE_SECRET_KEY}
      S3_BUCKET: ${Storage_Bucket:-images}

  security:
    build: ./security
    container_name: security
    expose:
      - "3000"
    networks:
      - minio-net
    environment:
      PORT: 3000

  gateway:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:8080"
    depends_on:
      - storage
      - uploader
      - security
    networks:
      - minio-net


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: qwerty123456
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - minio-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    ports:
      - "8081:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_SERVICEACCOUNTTOKEN: "AAEAAWVsYXN0aWMva2liYW5hL2tpYmFuYS10b2tlbi1maW5hbDpSN09mSGxSWFNfaXFTTnFZNTZBYnlB" 
    depends_on:
      - elasticsearch
    networks:
      - minio-net

  vector:
    image: timberio/vector:0.38.0-debian
    container_name: vector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro  # <-- Оба пути должны быть .yaml
    depends_on:
      - elasticsearch
    networks:
      - minio-net


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
    - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - minio-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "8082:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: qwerty123456
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - minio-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      - minio-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - minio-net